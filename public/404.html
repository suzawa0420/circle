<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16835d">
  <title>ページが見つかりませんでした | サークルブック</title>
  <link rel="stylesheet" href="/error-pages.css">
</head>
<body>
  <header class="error-header">
    <a href="/" aria-label="サークルブックのトップページへ">
      <img src="/images/logo.png" alt="サークルブック" width="194" height="50">
    </a>
  </header>
  <main class="error-main">
    <div class="error-card">
      <div class="error-card__art">
        <span class="error-code" aria-hidden="true">404</span>
        <img src="/images/mascot/squirrel-404.png" alt="本を開いて困っているリス" width="280" height="280">
      </div>
      <div class="error-card__copy">
        <p class="error-eyebrow">エラー 404</p>
        <h1>ページが見つかりませんでした</h1>
        <p class="error-description">お探しのページは移動または削除された可能性があります。トップページから、気になるサークルを探してみてください。</p>
        <div class="error-actions">
          <a class="error-button error-button--primary" href="/">トップページへ戻る</a>
          <a class="error-button error-button--secondary" href="/circles">サークルを探す</a>
        </div>
      </div>
    </div>
  </main>
  <footer class="error-footer">
    <p>お困りの場合は <a href="mailto:circlebook26@gmail.com?subject=Circlebook%20404">お問い合わせ</a> ください。</p>
  </footer>
</body>
</html>
