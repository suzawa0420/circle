<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16835d">
  <title>ページを表示できませんでした | サークルブック</title>
  <link rel="stylesheet" href="/error-pages.css">
</head>
<body>
  <header class="error-header">
    <a href="/" aria-label="サークルブックのトップページへ">
      <img src="/images/logo.png" alt="サークルブック" width="194" height="50">
    </a>
  </header>
  <main class="error-main">
    <div class="error-card">
      <div class="error-card__art">
        <span class="error-code" aria-hidden="true">500</span>
        <img src="/images/mascot/squirrel-apology.png" alt="本を抱えてお辞儀するリス" width="280" height="280">
      </div>
      <div class="error-card__copy">
        <p class="error-eyebrow">エラー 500</p>
        <h1>ページを表示できませんでした</h1>
        <p class="error-description">一時的な問題が発生しています。少し時間をおいてから、もう一度お試しください。</p>
        <div class="error-actions">
          <a class="error-button error-button--primary" href="/">トップページへ戻る</a>
          <a class="error-button error-button--secondary" href="mailto:circlebook26@gmail.com?subject=Circlebook%20500">不具合を報告する</a>
        </div>
      </div>
    </div>
  </main>
  <footer class="error-footer">
    <p>お困りの場合は <a href="mailto:circlebook26@gmail.com?subject=Circlebook%20500">お問い合わせ</a> ください。</p>
  </footer>
</body>
</html>
