<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16835d">
  <title>操作を完了できませんでした | サークルブック</title>
  <link rel="stylesheet" href="/error-pages.css">
</head>
<body>
  <header class="error-header">
    <a href="/" aria-label="サークルブックのトップページへ">
      <img src="/images/logo.png" alt="サークルブック" width="194" height="50">
    </a>
  </header>
  <main class="error-main">
    <div class="error-card">
      <div class="error-card__art">
        <span class="error-code" aria-hidden="true">422</span>
        <img src="/images/mascot/squirrel-sad.png" alt="本を抱えて悲しむリス" width="280" height="280">
      </div>
      <div class="error-card__copy">
        <p class="error-eyebrow">エラー 422</p>
        <h1>操作を完了できませんでした</h1>
        <p class="error-description">ページの有効期限が切れたか、入力内容を処理できませんでした。お手数ですが、もう一度お試しください。</p>
        <div class="error-actions">
          <a class="error-button error-button--primary" href="/">トップページへ戻る</a>
          <a class="error-button error-button--secondary" href="/circles">サークルを探す</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
