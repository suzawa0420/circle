name: Runtime upgrade checks
on:
  push:
    branches: [codex/al2023-runtime-upgrade]
  pull_request:
    paths:
      - Gemfile
      - Gemfile.lock
      - .ruby-version
      - .node-version
      - .github/workflows/runtime_upgrade.yml
      - ops/al2023/**
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: circle_test
          POSTGRES_PASSWORD: circle_test_only
          POSTGRES_DB: circle_runtime_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://circle_test:circle_test_only@127.0.0.1:5432/circle_runtime_test
      SECRET_KEY_BASE: ci-test-only-not-a-production-secret-0123456789012345678901234567890123456789
      AWS_EC2_METADATA_DISABLED: 'true'
      DISABLE_SPRING: '1'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y imagemagick libpq-dev nginx
      - run: python3 ops/al2023/test_origin_guard.py
      - run: python3 -m unittest discover -s ops/al2023 -p test_sync_assets.py
      - run: python3 -m unittest discover -s ops/al2023 -p test_asset_compatibility.py
      - uses: ruby/setup-ruby@v1
        with:
          bundler: '2.5.23'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: bundle exec rails db:schema:load zeitwerk:check
      - name: Test admin permissions
        run: bundle exec rails test test/models/admin_user_permissions_test.rb
      - name: Test circle publication
        run: bundle exec rails test test/models/user_test.rb
      - name: Test blog moderation
        run: bundle exec rails test test/models/blog_test.rb
      - name: Test facility reviews
        run: bundle exec rails test test/models/place_review_test.rb
      - name: Test runtime integration
        run: bundle exec rails test test/integration/runtime_upgrade_test.rb
      - name: Test invalid public URLs
        run: bundle exec rails test test/integration/public_invalid_urls_test.rb test/integration/public_search_seo_test.rb test/integration/listing_images_test.rb test/models/public_listing_styles_test.rb
      - name: Test circle owner permissions
        run: bundle exec rails test test/integration/circle_owner_permissions_test.rb
      - name: Test shared site design and navigation
        run: bundle exec rails test test/integration/site_design_test.rb test/integration/circle_faq_test.rb test/integration/circle_contact_warning_test.rb test/integration/circle_inquiry_guidance_test.rb
      - name: Test circle levels and ranking activity
        run: |
          bundle exec ruby test/helpers/circle_level_status_test.rb
          bundle exec rails test test/integration/circle_level_ranking_test.rb test/integration/circle_level_card_test.rb test/integration/legacy_contact_score_test.rb
      - name: Test participant chat and webmaster management
        run: bundle exec rails test test/integration/webmaster_remember_me_test.rb test/models/webmaster_login_migration_test.rb test/models/conversation_test.rb test/integration/admin_user_email_verifications_test.rb test/integration/registration_email_verification_test.rb test/integration/participant_accounts_test.rb test/integration/conversations_test.rb test/integration/conversation_concurrency_test.rb test/integration/conversation_urls_test.rb test/integration/webmaster_access_test.rb test/integration/webmaster_accounts_test.rb test/integration/webmaster_conversations_test.rb test/integration/webmaster_moderation_test.rb test/integration/mobile_navigation_test.rb test/controllers/bookmarks_controller_test.rb
      - run: bundle exec ruby test/security/run.rb
      - run: bundle exec ruby test/security/registration_turnstile_test.rb
      - run: node test/security/registration_turnstile_js_test.js
      - run: bundle exec ruby test/uploaders/image_uploader_url_check.rb
      - run: bundle exec ruby test/performance/unicorn_readiness_test.rb
      - run: bundle exec rails assets:precompile
      - run: bundle exec ruby bin/verify_brand_assets
      - run: bundle exec ruby test/runtime/puma_http_test.rb
      - run: bundle exec ruby test/runtime/production_boot_check.rb
