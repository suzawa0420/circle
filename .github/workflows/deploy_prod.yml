name: deploy_prod

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [all, server2]
        default: all

concurrency:
  group: circle-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: server3 - Update code
        if: inputs.target != 'server2'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST1 }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            cd ${{ secrets.DEPLOY_DIR }}
            git pull --ff-only origin master
      - name: server3 - Install frontend dependencies
        if: inputs.target != 'server2'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST1 }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            cd ${{ secrets.DEPLOY_DIR }}
            npm ci --ignore-scripts --no-audit --no-fund
      - name: server3 - Check migrations
        if: inputs.target != 'server2'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST1 }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            cd ${{ secrets.DEPLOY_DIR }}
            ~/.rbenv/shims/bundle exec rake db:migrate RAILS_ENV=production
      - name: server3 - Compile and verify assets
        if: inputs.target != 'server2'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST1 }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            cd ${{ secrets.DEPLOY_DIR }}
            ~/.rbenv/shims/bundle exec rake assets:precompile RAILS_ENV=production
            ~/.rbenv/shims/ruby bin/verify_brand_assets
      - name: server3 - Restart Unicorn
        if: inputs.target != 'server2'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST1 }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            cd ${{ secrets.DEPLOY_DIR }}
            kill -USR2 $(cat tmp/pids/unicorn.pid)
      - name: server2 - Check SSH connection
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST2 }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: 'true'
      - name: server2 - Check repository directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST2 }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            cd ${{ secrets.DEPLOY_DIR }}
            git rev-parse --is-inside-work-tree >/dev/null
      - name: server2 - Fetch master
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST2 }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            cd ${{ secrets.DEPLOY_DIR }}
            git fetch origin master
      - name: server2 - Update code
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST2 }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            cd ${{ secrets.DEPLOY_DIR }}
            git pull --ff-only origin master
      - name: server2 - Install frontend dependencies
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST2 }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            cd ${{ secrets.DEPLOY_DIR }}
            npm ci --ignore-scripts --no-audit --no-fund
      - name: server2 - Compile and verify assets
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST2 }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            cd ${{ secrets.DEPLOY_DIR }}
            ~/.rbenv/shims/bundle exec rake assets:precompile RAILS_ENV=production
            ~/.rbenv/shims/ruby bin/verify_brand_assets
      - name: server2 - Restart Unicorn
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST2 }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            cd ${{ secrets.DEPLOY_DIR }}
            kill -USR2 $(cat tmp/pids/unicorn.pid)
      - name: Verify production HTTP responses
        run: |
          set -eu
          for path in / /categories/ball-sports; do
            for attempt in 1 2 3 4 5; do
              url="https://circle-book.com${path}?deploy_check=${GITHUB_SHA}-${attempt}"
              status="$(curl --location --silent --show-error --connect-timeout 5 --max-time 20 --output /dev/null --write-out '%{http_code}' "$url")"
              if [ "$status" != "200" ]; then
                echo "Health check failed: $url returned HTTP $status"
                exit 1
              fi
            done
          done
