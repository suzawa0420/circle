name: deploy_prod
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [all, check-al2023]
        default: check-al2023
permissions:
  contents: read
concurrency:
  group: circle-production
  cancel-in-progress: false
jobs:
  verify-al2023:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: server4
            host: 13.112.50.106
            fingerprint: SHA256:5yMF6WivFltL/XBEmk8sCKgIVr3zYRArbaPfIJFfKO4
          - server: server5
            host: 54.238.207.76
            fingerprint: SHA256:+2zG0Qh8IdEVAmECUc2ZM1+X4vS1Con2Iv3UOJ1CGTI
    steps:
      - name: Check new server connection without changing it
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ matrix.host }}
          fingerprint: ${{ matrix.fingerprint }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            cd /var/www/circle
            /opt/circle/ruby-3.3.12/bin/ruby --version
            /opt/circle/node-v24.21.0-linux-x64/bin/node --version
            systemctl is-active circle-puma nginx
            git rev-parse --short HEAD
  checks:
    if: inputs.target != 'check-al2023'
    uses: ./.github/workflows/runtime_upgrade.yml
  prepare:
    if: inputs.target != 'check-al2023'
    needs: [verify-al2023, checks]
    runs-on: ubuntu-22.04
    strategy:
      max-parallel: 1
      matrix:
        include:
          - server: server4
            host: 13.112.50.106
            fingerprint: SHA256:5yMF6WivFltL/XBEmk8sCKgIVr3zYRArbaPfIJFfKO4
          - server: server5
            host: 54.238.207.76
            fingerprint: SHA256:+2zG0Qh8IdEVAmECUc2ZM1+X4vS1Con2Iv3UOJ1CGTI
    steps:
      - name: Prepare the exact tested commit and retain old assets
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref_name }}
        with:
          host: ${{ matrix.host }}
          fingerprint: ${{ matrix.fingerprint }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: DEPLOY_SHA,DEPLOY_REF
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /var/www/circle
            git fetch --no-tags origin "$DEPLOY_REF"
            git show "$DEPLOY_SHA:ops/al2023/deploy.sh" | sudo -n runuser -u ec2-user -g nginx -- bash -s -- prepare "$DEPLOY_SHA"
  activate:
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      max-parallel: 1
      matrix:
        include:
          - server: server4
            host: 13.112.50.106
            fingerprint: SHA256:5yMF6WivFltL/XBEmk8sCKgIVr3zYRArbaPfIJFfKO4
          - server: server5
            host: 54.238.207.76
            fingerprint: SHA256:+2zG0Qh8IdEVAmECUc2ZM1+X4vS1Con2Iv3UOJ1CGTI
    steps:
      - name: Restart and warm one server after both asset sets are ready
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ matrix.host }}
          fingerprint: ${{ matrix.fingerprint }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 10m
          script: |
            set -eu
            bash /var/www/circle/ops/al2023/deploy.sh activate "$DEPLOY_SHA"
