name: deploy_prod

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
          - name: Deploy to circle-book-web-server3
            uses: appleboy/ssh-action@master
            with:
              host: ${{ secrets.DEPLOY_HOST1 }}
              username: ${{ secrets.DEPLOY_USER }}
              port: ${{ secrets.DEPLOY_PORT }}
              key: ${{ secrets.DEPLOY_KEY }}
              script: |
                set -eu
                cd ${{ secrets.DEPLOY_DIR }}
                git pull --ff-only origin master
                npm ci --ignore-scripts --no-audit --no-fund
                ~/.rbenv/shims/bundle exec rake db:migrate RAILS_ENV=production
                ~/.rbenv/shims/bundle exec rake assets:precompile RAILS_ENV=production
                ~/.rbenv/shims/ruby bin/verify_brand_assets
                kill -USR2 $(cat tmp/pids/unicorn.pid)
          - name: Deploy to circle-book-web-server2
            uses: appleboy/ssh-action@master
            with:
              host: ${{ secrets.DEPLOY_HOST2 }}
              username: ${{ secrets.DEPLOY_USER }}
              port: ${{ secrets.DEPLOY_PORT }}
              key: ${{ secrets.DEPLOY_KEY }}
              script: |
                set -eu
                cd ${{ secrets.DEPLOY_DIR }}
                git pull --ff-only origin master
                npm ci --ignore-scripts --no-audit --no-fund
                ~/.rbenv/shims/bundle exec rake assets:precompile RAILS_ENV=production
                ~/.rbenv/shims/ruby bin/verify_brand_assets
                kill -USR2 $(cat tmp/pids/unicorn.pid)
