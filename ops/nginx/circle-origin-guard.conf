# Circle Book: Cloudflare -> Lightsail LB -> Nginx.
# HTTP-context include. Public instance ports must stay closed.
# Trust only the Lightsail private network, and use the LAST XFF hop.
# Do not enable recursive lookup: that would select the visitor instead of CF.
geo $circle_origin_cf {
    default 0;
    proxy 172.26.0.0/16;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    108.162.192.0/18 1;
    131.0.72.0/22 1;
    141.101.64.0/18 1;
    162.158.0.0/15 1;
    172.64.0.0/13 1;
    173.245.48.0/20 1;
    188.114.96.0/20 1;
    190.93.240.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
geo $circle_origin_private {
    default 0;
    172.26.0.0/16 1;
}
geo $circle_origin_local {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
}
map "$circle_origin_cf:$host" $circle_origin_web {
    default 0;
    "1:circle-book.com" 1;
    "1:www.circle-book.com" 1;
}
# LB health checks have no XFF. External /health requests do, so cannot use this.
map "$circle_origin_private:$request_method:$request_uri:$http_x_forwarded_for" $circle_origin_health {
    default 0;
    "1:GET:/health:" 1;
    "1:HEAD:/health:" 1;
}
# Keep local deployment health checks without creating a forwarded-header bypass.
map "$circle_origin_local:$circle_origin_web:$circle_origin_health" $circle_origin_deny {
    default 1;
    ~^1: 0;
    ~^0:1: 0;
    "0:0:1" 0;
}
