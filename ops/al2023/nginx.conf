user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    types_hash_max_size 4096;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    # Avoid recording query strings, cookies or credentials.
    log_format circle '$remote_addr $request_method $uri $status $request_time';
    access_log /var/log/nginx/access.log circle;
    include /etc/nginx/circle-origin-guard.conf;
    upstream circle_unicorn {
        server unix:/var/www/circle/tmp/sockets/unicorn.sock fail_timeout=0;
    }
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name circle-book.com www.circle-book.com;
        root /var/www/circle/public;
        client_max_body_size 20M;
        if ($circle_origin_deny) { return 403; }
        location ~ /\. { deny all; }
        # /health must reach Rails so a stopped Unicorn is never marked healthy.
        location = /health { try_files /__circle_health_not_a_file__ @rails; }
        location / { try_files $uri @rails; }
        location @rails {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect off;
            proxy_read_timeout 60;
            proxy_pass http://circle_unicorn;
        }
    }
}
