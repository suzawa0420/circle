user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    types_hash_max_size 4096;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    # Avoid recording query strings, cookies or credentials.
    # JSON escaping prevents crafted headers from breaking log records. No query strings.
    log_format circle escape=json
        '{"time":"$time_iso8601","peer":"$remote_addr","method":"$request_method",'
        '"path":"$uri","host":"$host","status":$status,"duration":$request_time,'
        '"upstream_status":"$upstream_status","ua":"$http_user_agent",'
        '"cf_ray":"$http_cf_ray","cf_client":"$circle_log_cf_client",'
        '"last_hop":"$circle_last_hop","origin_deny":"$circle_origin_deny",'
        '"private_peer":"$circle_private_peer","cf_hop":"$circle_cloudflare_hop",'
        '"host_ok":"$circle_host_ok","health_allowed":"$circle_health_allowed"}';
    access_log /var/log/nginx/access.log circle;
    include /etc/nginx/circle-origin-guard.conf;
    # Only retain Cloudflare's client IP when the trusted origin path passed the guard.
    map $circle_cf_allowed $circle_log_cf_client {
        default "";
        1 $http_cf_connecting_ip;
    }
    upstream circle_unicorn {
        server unix:/var/www/circle/tmp/sockets/unicorn.sock fail_timeout=0;
    }
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name circle-book.com www.circle-book.com;
        root /var/www/circle/public;
        client_max_body_size 20M;
        if ($circle_origin_deny) { return 403; }
        location ~ /\. { deny all; }
        # /health must reach Rails so a stopped Unicorn is never marked healthy.
        location = /health { try_files /__circle_health_not_a_file__ @rails; }
        location / { try_files $uri @rails; }
        location @rails {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect off;
            proxy_read_timeout 60;
            proxy_pass http://circle_unicorn;
        }
    }
}
