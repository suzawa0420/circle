# Included inside http {}. Public HTTP must also remain closed in Lightsail.
# Trust the final XFF hop only when the TCP peer is the private load balancer.
geo $remote_addr $circle_private_peer {
    default 0;
    172.26.0.0/16 1;
}
geo $remote_addr $circle_local_peer {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
}
map $http_x_forwarded_for $circle_last_hop {
    default "";
    "~(?:^|,\s*)(?<circle_last_address>[^,\s]+)\s*$" $circle_last_address;
}
geo $circle_last_hop $circle_cloudflare_hop {
    default 0;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    108.162.192.0/18 1;
    131.0.72.0/22 1;
    141.101.64.0/18 1;
    162.158.0.0/15 1;
    172.64.0.0/13 1;
    173.245.48.0/20 1;
    188.114.96.0/20 1;
    190.93.240.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
map $host $circle_host_ok {
    default 0;
    circle-book.com 1;
    www.circle-book.com 1;
}
map "$circle_private_peer:$circle_cloudflare_hop:$circle_host_ok" $circle_cf_allowed {
    default 0;
    "1:1:1" 1;
}
map "$circle_private_peer:$request_method:$request_uri:$http_x_forwarded_for" $circle_health_allowed {
    default 0;
    "1:GET:/health:" 1;
    "1:HEAD:/health:" 1;
}
map "$circle_local_peer:$circle_cf_allowed:$circle_health_allowed" $circle_origin_deny {
    default 1;
    ~^1: 0;
    ~^[01]:1: 0;
    ~^[01]:[01]:1$ 0;
}
